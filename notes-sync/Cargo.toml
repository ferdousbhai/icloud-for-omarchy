[package]
name = "icloud-notes-sync"
version = "0.2.0"
edition.workspace = true
description = "Sync iCloud Notes with a folder of Markdown files (a Rust port of icloud-md)"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
name = "icloud_notes_sync"
path = "src/lib.rs"

[[bin]]
name = "icloud-notes-sync"
path = "src/main.rs"

[dependencies]
clap.workspace = true
flate2 = "1"
icloud-session = { workspace = true, features = ["clap"] }
icu_collator = "2"
indexmap = { version = "2", features = ["serde"] }
markdown = "1.0.0"
regex = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
