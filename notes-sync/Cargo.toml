[package]
name = "icloud-notes-sync"
version = "0.1.0"
edition = "2024"
description = "Sync iCloud Notes with a folder of Markdown files (a Rust port of icloud-md)"
license = "MIT"
repository = "https://github.com/ferdousbhai/icloud-notes-sync"
readme = "README.md"
publish = false

[lib]
name = "icloud_notes_sync"
path = "src/lib.rs"

[[bin]]
name = "icloud-notes-sync"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
icloud-session = { path = "../icloud-session" }
indexmap = { version = "2", features = ["serde"] }
markdown = "1.0.0"
protobuf = "=3.7.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protobuf-codegen = "=3.7.2"

[dev-dependencies]
tempfile = "3"
