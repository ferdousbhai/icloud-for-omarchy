[package]
name = "icloud-photos"
version = "0.2.0"
edition.workspace = true
description = "iCloud Photos for Omarchy: browse, download, upload and delete, over the shared icloud-session sign-in"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "icloud_photos"
path = "src/lib.rs"

[[bin]]
name = "icloud-photos"
path = "src/main.rs"

[dependencies]
# The shared iCloud sign-in (a D-Bus client for icloud-sessiond).
icloud-session.workspace = true
gtk.workspace = true
adw.workspace = true
async-channel.workspace = true
clap.workspace = true
base64 = "0.22"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
# renameat2(RENAME_NOREPLACE): originals never replace a file on disk.
libc = "0.2"
# Only for ICLOUD_SESSION_MOCK=1: plain HTTP to a local fake server, no TLS.
ureq.workspace = true

[dev-dependencies]
tiny_http.workspace = true
jpeg-encoder = "0.7"
