[package]
name = "icloud-photos"
version = "0.3.1"
edition.workspace = true
description = "iCloud Photos for Omarchy: browse, download, upload and delete, over the shared icloud-session sign-in"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "icloud_photos"
path = "src/lib.rs"

[[bin]]
name = "icloud-photos"
path = "src/main.rs"

[dependencies]
# The shared iCloud sign-in (a D-Bus client for icloud-sessiond).
icloud-session = { workspace = true, features = ["clap"] }
gtk.workspace = true
adw.workspace = true
async-channel.workspace = true
clap.workspace = true
base64 = "0.22"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
# renameat2(RENAME_NOREPLACE): originals never replace a file on disk.
# (Already in the tree, through tempfile.)
rustix = { version = "1", features = ["fs"] }
# localtime_r: the UTC offset an upload reports, without GLib.
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
jpeg-encoder = "0.7"
