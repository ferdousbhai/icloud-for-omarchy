# Push a tag like v0.2.0 and this builds the Arch package, signs it, and
# publishes a pacman repository as the GitHub release for that tag. Users who
# ran install.sh get the update through `omarchy update`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git github-cli qt6-base qt6-declarative

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # makepkg refuses to run as root.
      - name: Create an unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Build, sign and index the package
        env:
          PACKAGING_GPG_KEY: ${{ secrets.PACKAGING_GPG_KEY }}
        run: |
          [[ -n $PACKAGING_GPG_KEY ]] || { echo "The PACKAGING_GPG_KEY secret is not set." >&2; exit 1; }
          runuser -u builder -- env PACKAGING_GPG_KEY="$PACKAGING_GPG_KEY" bash .github/scripts/build-repo.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "icloud-notes $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
