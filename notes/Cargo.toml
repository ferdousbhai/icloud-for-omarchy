[package]
name = "icloud-notes"
version.workspace = true
edition.workspace = true
description = "iCloud Notes on Omarchy: the window, the command line and the background sync"
license.workspace = true
repository.workspace = true
publish = false

default-run = "icloud-notes"

# The library has no toolkit in it: the vault, the note list and tree, the
# lock, saving and its guardrails, the merge of unsaved edits, and the
# command line. The sync engine is icloud-notes-sync, run as a separate
# process. The window is the binary icloud-notes-app.
[lib]
name = "icloud_notes"

# The command line and `--sync`. Started as the app (no command), it runs
# icloud-notes-app from its own directory in its place.
[[bin]]
name = "icloud-notes"
path = "src/main.rs"

# The window (GTK 4 with omui's look, theme and widgets), in src/bin/app/:
# only it links GTK.
[[bin]]
name = "icloud-notes-app"
path = "src/bin/app/main.rs"
required-features = ["ui"]

[features]
default = ["ui"]
ui = ["dep:icloud-app-ui", "dep:gtk", "dep:omui", "dep:async-channel", "dep:cairo-rs", "dep:pangocairo"]
# The window driven by a script (bin/qa): omui's scripted QA, which a release build leaves out.
qa = ["ui", "omui/qa", "icloud-app-ui/qa"]

# tests/blackbox/ drives the icloud-notes binary ICLOUD_NOTES_BIN names, as
# a separate process (bin/check names the one built here). Without one it
# fails; ICLOUD_NOTES_BLACKBOX=skip leaves it out of a run, but not in CI.
[[test]]
name = "blackbox"
path = "tests/blackbox/main.rs"

[dependencies]
# The workspace's session/ crate: the sign-in, the output modes, the shared wording.
icloud-session.workspace = true
# The left-iCloud record's place (app/).
icloud-app.workspace = true
# Folder names sort as Apple Notes sorts them (numeric, ignoring case).
icu_collator = "2"
icu_locale_core = "2"
# Which characters are digits, as a list marker's number.
icu_properties = "2.3"
# The local time in a conflict backup's name and a trashed file's record.
jiff = "0.2"
# renameat2, and the lock's descriptor handed to the engine.
rustix = { version = "1", features = ["fs", "process"] }
serde_json.workspace = true
# ReportSignInRequired, which icloud-session's API keeps to itself.
zbus.workspace = true
# The application under the one name, the catalog test, and with `qa` the QA scripts' language switch and close
# (app/ui/): the window's alone.
icloud-app-ui = { workspace = true, optional = true }
gtk = { workspace = true, optional = true }
omui = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }
# export-pdf: a note laid out on PDF pages, with no display.
cairo-rs = { version = "0.22", features = ["pdf"], optional = true }
pangocairo = { version = "0.22", optional = true }

[dev-dependencies]
icloud-app = { workspace = true, features = ["testing"] }
tempfile.workspace = true
