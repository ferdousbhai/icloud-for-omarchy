[package]
name = "icloud-notes"
version.workspace = true
edition.workspace = true
description = "iCloud Notes on Omarchy: the vault, the command line and the background sync, without a window"
license.workspace = true
repository.workspace = true
publish = false

default-run = "icloud-notes"

# The Qt app beside this file (icloud-notes.pro, src/*.cpp, qml/) is still
# the one installed. The library is its non-UI half in Rust, with no toolkit
# in it: the vault, the note list and tree, the lock, saving and its
# guardrails, the merge of unsaved edits, and the command line. The sync
# engine stays icloud-notes-sync, run as a separate process. The window
# that replaces the Qt one is the binary icloud-notes-app, not installed yet.
[lib]
name = "icloud_notes"

# The command line and `--sync`. Started as the app (no command), it runs
# icloud-notes-app from its own directory in its place.
[[bin]]
name = "icloud-notes"
path = "src/main.rs"

# The window (GTK 4 with omui's look, theme and widgets), in src/bin/app/:
# only it links GTK.
[[bin]]
name = "icloud-notes-app"
path = "src/bin/app/main.rs"
required-features = ["ui"]

[features]
default = ["ui"]
ui = ["dep:gtk", "dep:omui", "dep:async-channel"]

# tests/blackbox/ drives whichever icloud-notes binary ICLOUD_NOTES_BIN names,
# so the same suite holds the Qt binary and this one.
[[test]]
name = "blackbox"
path = "tests/blackbox/main.rs"

[dependencies]
# The workspace's session/ crate: the sign-in, the output modes, the shared wording.
icloud-session.workspace = true
# The left-iCloud record's place (app/).
icloud-app.workspace = true
# Folder names sort as Apple Notes sorts them (numeric, ignoring case).
icu_collator = "2"
icu_locale_core = "2"
# Which characters are digits, as a list marker's number.
icu_properties = "2.3"
# The local time in a conflict backup's name and a trashed file's record.
jiff = "0.2"
# renameat2, and the lock's descriptor handed to the engine.
rustix = { version = "1", features = ["fs", "process"] }
serde_json.workspace = true
# ReportSignInRequired, which icloud-session's API keeps to itself.
zbus.workspace = true
gtk = { workspace = true, optional = true }
omui = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }

[dev-dependencies]
icloud-app = { workspace = true, features = ["testing"] }
tempfile.workspace = true
