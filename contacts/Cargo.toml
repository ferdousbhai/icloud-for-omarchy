[package]
name = "icloud-contacts"
version.workspace = true
edition.workspace = true
description = "iCloud Contacts on Omarchy: browse, search, add, edit and delete contacts"
license.workspace = true
repository.workspace = true
publish = false
default-run = "icloud-contacts"

[lib]
name = "icloud_contacts"

# The command line. It never calls into GTK, so it links without GTK and
# starts fast; with no command it runs icloud-contacts-app.
[[bin]]
name = "icloud-contacts"
path = "src/main.rs"

# The window (and, given a command, the command line too). Its code is in
# the binary, so none of it can reach the library the command line links.
[[bin]]
name = "icloud-contacts-app"
path = "src/bin/app/main.rs"
required-features = ["ui"]

# The library (the contacts service, the cache, vCard, the command line)
# needs no GTK, so `cargo test --no-default-features` runs on a machine
# without the GTK stack.
[features]
default = ["ui"]
ui = ["dep:gtk", "dep:adw", "dep:async-channel"]

[dependencies]
# The workspace's session/ crate.
icloud-session = { workspace = true, features = ["clap"] }
clap.workspace = true
# flock(2) on the cache, shared by the app and the CLI.
rustix = { version = "1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true
gtk = { workspace = true, optional = true }
adw = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
