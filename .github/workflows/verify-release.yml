name: Verify published release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Verify every installer from this exact suite tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts zstd
          bin/verify-release "$RELEASE_TAG"
