[package]
name = "icloud-sessiond"
version = "0.6.0"
edition.workspace = true
description = "D-Bus service, sign-in window and CLI that own one iCloud web sign-in"
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["signin"]
# The GTK4 + WebKitGTK 6 sign-in window. Off: everything else builds and
# tests without webkitgtk-6.0 installed.
signin = ["dep:webkit6"]

[lib]
# The CLI's help text (src/cli.rs doc comments) has shell examples, not Rust.
doctest = false

# Also the icloud-session CLI, run by that name (the package links it).
[[bin]]
name = "icloud-sessiond"
path = "src/main.rs"

[[bin]]
name = "icloud-session-signin"
path = "src/bin/signin.rs"
required-features = ["signin"]

[dependencies]
icloud-session = { workspace = true, features = ["clap"] }
blocking = "1"
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
ureq.workspace = true
url.workspace = true
uuid.workspace = true
zbus.workspace = true
webkit6 = { version = "0.6", features = ["v2_42", "gtk_v4_18"], optional = true }
rpassword = "7"
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
