[package]
name = "icloud-sessiond"
version = "0.2.0"
edition = "2024"
description = "D-Bus service, sign-in window and CLI that own one iCloud web sign-in"
license = "MIT"
repository = "https://github.com/ferdousbhai/icloud-session"
publish = false

[[bin]]
name = "icloud-sessiond"
path = "src/main.rs"

[[bin]]
name = "icloud-session"
path = "src/bin/cli.rs"

[dependencies]
icloud-session = { path = ".." }
blocking = "1"
httpdate = "1"
humantime = "2"
inotify = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
