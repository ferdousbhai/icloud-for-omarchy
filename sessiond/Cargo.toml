[package]
name = "icloud-sessiond"
version.workspace = true
edition.workspace = true
description = "D-Bus service, sign-in window and CLI that own one iCloud web sign-in"
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["signin"]
# The GTK4 + WebKitGTK 6 sign-in window. Off: everything else builds and
# tests without webkitgtk-6.0 installed.
# omui gives it the look of the apps' windows: GTK code alone, on the gtk4
# webkit6 already brings, so the daemon binary links nothing more for it
# (tests/links.rs).
signin = ["dep:webkit6", "dep:omui"]

[lib]
# The CLI's help text (src/cli.rs doc comments) has shell examples, not Rust.
doctest = false

# Also the icloud-session CLI, run by that name (the package links it).
[[bin]]
name = "icloud-sessiond"
path = "src/main.rs"

[[bin]]
name = "icloud-session-signin"
path = "src/bin/signin.rs"
required-features = ["signin"]

[dependencies]
icloud-session = { workspace = true, features = ["clap"] }
# leave: Omacloud ready, the left records, the shared confirmation.
icloud-app.workspace = true
base64.workspace = true
blocking = "1"
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
ureq.workspace = true
url.workspace = true
uuid.workspace = true
zbus.workspace = true
webkit6 = { version = "0.6", features = ["v2_42", "gtk_v4_18"], optional = true }
omui = { workspace = true, optional = true }
rpassword = "7"
# The cookies.sqlite an older sign-in window left, read once for its
# device trust.
rusqlite.workspace = true
zeroize = "1"

[dev-dependencies]
icloud-app = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tiny_http.workspace = true
