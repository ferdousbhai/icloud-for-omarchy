[package]
name = "icloud-sessiond"
version = "0.2.0"
edition = "2024"
description = "D-Bus service, sign-in window and CLI that own one iCloud web sign-in"
license = "MIT"
repository = "https://github.com/ferdousbhai/icloud-session"
publish = false

[features]
default = ["signin"]
# The GTK4 + WebKitGTK 6 sign-in window. Off: everything else builds and
# tests without webkitgtk-6.0 installed.
signin = ["dep:webkit6"]

[[bin]]
name = "icloud-sessiond"
path = "src/main.rs"

[[bin]]
name = "icloud-session"
path = "src/bin/cli.rs"

[[bin]]
name = "icloud-session-signin"
path = "src/bin/signin.rs"
required-features = ["signin"]

[dependencies]
icloud-session = { path = ".." }
blocking = "1"
humantime = "2"
inotify = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
webkit6 = { version = "0.6", features = ["v2_42", "gtk_v4_18"], optional = true }
oo7 = { version = "0.5", default-features = false, features = ["async-std", "native_crypto"] }
rpassword = "7"
zeroize = "1"
futures-lite = "2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
