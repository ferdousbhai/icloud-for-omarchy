[package]
name = "icloud-sessiond"
version = "0.3.0"
edition.workspace = true
description = "D-Bus service, sign-in window and CLI that own one iCloud web sign-in"
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["signin"]
# The GTK4 + WebKitGTK 6 sign-in window. Off: everything else builds and
# tests without webkitgtk-6.0 installed.
signin = ["dep:webkit6"]

[[bin]]
name = "icloud-sessiond"
path = "src/main.rs"

[[bin]]
name = "icloud-session"
path = "src/bin/cli.rs"

[[bin]]
name = "icloud-session-signin"
path = "src/bin/signin.rs"
required-features = ["signin"]

[dependencies]
icloud-session = { workspace = true, features = ["clap"] }
blocking = "1"
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
ureq.workspace = true
url.workspace = true
uuid.workspace = true
zbus.workspace = true
webkit6 = { version = "0.6", features = ["v2_42", "gtk_v4_18"], optional = true }
oo7 = { version = "0.5", default-features = false, features = ["async-std", "native_crypto"] }
rpassword = "7"
zeroize = "1"
futures-lite.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
