[package]
name = "icloud-session"
version = "0.2.0"
edition = "2024"
description = "Client for icloud-sessiond, the D-Bus service that owns one iCloud web sign-in for all apps"
license = "MIT"
repository = "https://github.com/ferdousbhai/icloud-session"
readme = "README.md"
keywords = ["icloud", "apple", "session", "dbus"]
categories = ["api-bindings"]
exclude = ["pkgbuild/", "sessiond/", "data/"]

[lib]
name = "icloud_session"

[dependencies]
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "2"
url = "2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[workspace]
members = ["sessiond"]
default-members = [".", "sessiond"]
resolver = "3"
