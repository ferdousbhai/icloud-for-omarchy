[package]
name = "icloud-session"
version = "0.1.0"
edition = "2024"
description = "Shared iCloud web session for apps that sign in through icloud-md"
license = "MIT"
repository = "https://github.com/ferdousbhai/icloud-session"
readme = "README.md"
keywords = ["icloud", "apple", "session", "cookies"]
categories = ["command-line-utilities", "api-bindings"]
exclude = ["pkgbuild/"]

[lib]
name = "icloud_session"

[[bin]]
name = "icloud-session"
path = "src/main.rs"

[dependencies]
humantime = "2.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
ureq = "2"
url = "2"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
humantime = "2.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
tiny_http = "0.12.0"
url = "2"
