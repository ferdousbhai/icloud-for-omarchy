[package]
name = "icloud-session"
version = "0.6.0"
edition.workspace = true
description = "Client for icloud-sessiond, the D-Bus service that owns one iCloud web sign-in for all apps"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["icloud", "apple", "session", "dbus"]
categories = ["api-bindings"]

[lib]
name = "icloud_session"

[features]
# `cli::parse`, for the tools' clap command lines.
clap = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
futures-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true
url.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
