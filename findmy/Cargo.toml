[package]
name = "icloud-findmy"
version = "0.1.0"
edition.workspace = true
description = "Find My devices on Omarchy: locate, play a sound, lost mode, history trail"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "icloud_findmy"

[[bin]]
name = "icloud-findmy"
path = "src/main.rs"

# The core (findme, history, models) needs no GTK, so `cargo test
# --no-default-features` runs on a machine without the GTK stack.
# `gtk` builds the widgets that need only gtk4 + libadwaita; `ui` adds
# libshumate for the map and the app. Without `ui` the binary is the
# command line only.
[features]
default = ["ui"]
gtk = ["dep:gtk", "dep:adw", "dep:async-channel"]
ui = ["gtk", "dep:shumate"]

[dependencies]
# The workspace's session/ crate.
icloud-session.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
dirs = "7"
gtk = { workspace = true, optional = true }
adw = { workspace = true, optional = true }
shumate = { package = "libshumate", version = "0.8", optional = true }
async-channel = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
