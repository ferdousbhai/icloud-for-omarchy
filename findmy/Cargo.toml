[package]
name = "icloud-findmy"
version = "0.1.0"
edition = "2024"
description = "Find My devices on Omarchy: locate, play a sound, lost mode, history trail"
license = "MIT"
repository = "https://github.com/ferdousbhai/icloud-findmy"
publish = false

[lib]
name = "icloud_findmy"

[[bin]]
name = "icloud-findmy"
path = "src/main.rs"
required-features = ["ui"]

# The core (findme, history, models) needs no GTK, so `cargo test
# --no-default-features` runs on a machine without the GTK stack.
# `gtk` builds the widgets that need only gtk4 + libadwaita; `ui` adds
# libshumate for the map and builds the app.
[features]
default = ["ui"]
gtk = ["dep:gtk", "dep:adw"]
ui = ["gtk", "dep:shumate"]

[dependencies]
icloud-session = { path = "../icloud-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "7"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"], optional = true }
shumate = { package = "libshumate", version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
