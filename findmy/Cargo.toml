[package]
name = "icloud-findmy"
version = "0.3.0"
edition.workspace = true
description = "Find My devices on Omarchy: locate, play a sound, lost mode, history trail"
license.workspace = true
repository.workspace = true
publish = false
default-run = "icloud-findmy"

[lib]
name = "icloud_findmy"

# The command line. It never calls into GTK, so it links without GTK and
# starts fast; with no command it runs icloud-findmy-app.
[[bin]]
name = "icloud-findmy"
path = "src/main.rs"

# The window (and, given a command, the command line too).
[[bin]]
name = "icloud-findmy-app"
path = "src/bin/app.rs"
required-features = ["ui"]

# The core (findme, history, models) needs no GTK, so `cargo test
# --no-default-features` runs on a machine without the GTK stack. `ui`
# (gtk4, libadwaita, libshumate) builds the app; without it only the
# command line is built.
[features]
default = ["ui"]
ui = ["dep:gtk", "dep:adw", "dep:async-channel", "dep:shumate"]

[dependencies]
# The workspace's session/ crate.
icloud-session = { workspace = true, features = ["clap"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
gtk = { workspace = true, optional = true }
adw = { workspace = true, optional = true }
shumate = { package = "libshumate", version = "0.8", optional = true }
async-channel = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
