[workspace]
members = ["session", "sessiond", "notes-sync", "photos", "findmy"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ferdousbhai/icloud-for-omarchy"

# Versions shared by more than one crate. A crate adds its own features on
# top (`serde_json = { workspace = true, features = ["preserve_order"] }`).
[workspace.dependencies]
# bin/release keeps this version equal to session/Cargo.toml's.
icloud-session = { version = "0.5.0", path = "session" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
async-channel = "2"
clap = { version = "4", features = ["derive"] }
futures-lite = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Profiles only take effect at the workspace root. These were icloud-photos'
# and now apply to every crate's release build.
[profile.release]
lto = "thin"
strip = true
